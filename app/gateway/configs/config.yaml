environment: ${APP_ENV:dev}
server:
  http:
    addr: ${HTTP_ADDR:0.0.0.0:8080}
    timeout: 5s
data:
  cache:
    addr: ${REDIS_ADDR:127.0.0.1:6379}
    read_timeout: 0.2s
    write_timeout: 0.2s
  broker:
    type: ${BROKER_TYPE:nats}
    addr: ${BROKER_ADDR:nats://127.0.0.1:4222}
trace:
  endpoint: ${TRACING_ENDPOINT:127.0.0.1:4317}
registry:
  consul:
    address: ${CONSUL_ADDR:127.0.0.1:8500}
    scheme: http
auth:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  access_token_expire: 7200s
  refresh_token_expire: 604800s
